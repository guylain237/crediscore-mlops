# Supervision de l'infrastructure et du pipeline (Blocs 2 et 3).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/regles_alertes.yml

scrape_configs:
  # Ressources de la VM : CPU, mémoire, disque — surveillance d'infrastructure
  - job_name: vm
    static_configs:
      - targets: ["node-exporter:9100"]

  # Consommation par conteneur : attribue la charge à un service précis
  - job_name: conteneurs
    static_configs:
      - targets: ["cadvisor:8080"]

  # Santé du pipeline : durées de DAG, tâches en échec, retards d'ordonnancement
  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]

  # API de scoring (Bloc 4) : latence, taux d'acceptation, volume de décisions
  - job_name: api_scoring
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
